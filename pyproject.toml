[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert used (fine in tests; app code has almost none)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + obviously-fake test credentials

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
